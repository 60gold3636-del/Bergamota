name: ios-root

# Build the iOS 18.7.8 root image (research/ios18/ios18-root-full.simg) on a macOS runner, exactly as the README's
# Mac steps do it ("3. Renegade"): renegade fetch-tools, renegade fetch, renegade root. The image holds Apple's
# software and this repository is public, so it is uploaded only encrypted (AES-256, key in the ROOT_KEY secret),
# split into parts, and kept for 3 days.

on:
  workflow_dispatch:
    inputs:
      root_args:
        description: extra mkroot-full.py options (e.g. --no-jb)
        required: false
        default: ""
  push:
    branches: [mi8-dipper]
    paths: [".github/workflows/root.yml"]

concurrency:
  group: ios-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Key present
        env:
          ROOT_KEY: ${{ secrets.ROOT_KEY }}
        run: test -n "$ROOT_KEY" || { echo "::error::ROOT_KEY secret missing"; exit 1; }

      - name: Disk before
        run: df -h / "$GITHUB_WORKSPACE"; sw_vers; xcodebuild -version | head -1

      - name: Free disk (other Xcodes, simulators, Android SDK)
        run: |
          keep=$(xcode-select -p | sed 's#/Contents/Developer##')
          for x in /Applications/Xcode*.app; do [ "$x" = "$keep" ] || sudo rm -rf "$x"; done
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator/Profiles/Runtimes \
            ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules ~/.dotnet ~/.rustup 2>/dev/null || true
          df -h /

      - name: Tools (README "Getting started")
        run: |
          # Homebrew refuses formulae from third-party taps until the tap is trusted (ipsw pulls ipsw-frida)
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install --formula blacktop/tap/ipsw
          ipsw version || true

      - name: renegade fetch-tools (prebuilt on-device tools, berga-tools.zip)
        env:
          # berga_tools.py authenticates with it; anonymous API calls from shared runner IPs hit the rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/renegade/renegade fetch-tools && tools/renegade/renegade fetch-tools --status

      - name: SSH sources (docs/SSH_OVER_USB.md table, SHA-256 checked)
        run: |
          brew install gnu-sed
          W=research/ssh-build
          get() {  # name sha256 url [url...]: first URL that downloads AND matches the SHA-256 wins
            n=$1; h=$2; shift 2
            mkdir -p "$W/dl/$n" "$W/src/$n"
            for u in "$@"; do
              f="$W/dl/$n/$(basename "$u")"
              if curl -fsSL --retry 2 --max-time 120 -o "$f" "$u" && echo "$h  $f" | shasum -a 256 -c -; then
                tar -xf "$f" -C "$W/src/$n"; return 0
              fi
              echo "  $u: not usable"; rm -f "$f"
            done
            echo "::error::$n: no source matched $h"; return 1
          }
          get dropbear e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81 \
            https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2
          # upstream serves dash over plain HTTP only; Debian's orig tarball is the identical file (same SHA-256)
          get dash 40090101a2a491f13e901d3d48e90414f26634628b9bfff35ff540363c227a7d \
            https://deb.debian.org/debian/pool/main/d/dash/dash_0.5.13.5.orig.tar.gz \
            http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.13.5.tar.gz
          get toybox 44e2bab43dfe2c171743297631ce558c6d9ed38b87a66fd751cef617574b375e \
            https://landley.net/toybox/downloads/toybox-0.8.15.tar.gz \
            http://landley.net/toybox/downloads/toybox-0.8.15.tar.gz
          ls "$W"/src/*

      # /bin/sh in the root comes from here; the verify stage fails without it
      - name: SSH binaries (dropbear/dash/toybox)
        run: tools/ssh/build.sh

      - name: renegade fetch (iOS 18.7.8 iPhone11,8 root + cryptexes from Apple, decrypted)
        run: tools/renegade/renegade fetch && df -h /

      # mkroot-full.py looks for research/ssh-build/out (and the netcfg/sweetreboot fallbacks) in a sibling
      # checkout named ios-beryllium (the maintainer's layout); point that name at this checkout, else the ssh
      # tweak is skipped and the verify stage fails on /bin/sh (run 40070549009).
      - name: Sibling checkout name expected by mkroot-full.py
        run: |
          ln -sfn "$GITHUB_WORKSPACE" "$(dirname "$GITHUB_WORKSPACE")/ios-beryllium"
          ls -l "$(dirname "$GITHUB_WORKSPACE")/ios-beryllium/research/ssh-build/out"

      - name: renegade root
        # --no-bluetooth: the berga-tools BlueTool stub carries its own signing identifier, which the verify stage
        # reports as an identity change (run 40068553402); Bluetooth is not working on the Mi 8 yet anyway.
        run: tools/renegade/renegade root --delete-sources --no-bluetooth ${{ inputs.root_args }} && df -h /

      - name: Encrypt and split
        env:
          ROOT_KEY: ${{ secrets.ROOT_KEY }}
        run: |
          S=research/ios18/ios18-root-full.simg
          ls -l "$S"
          mkdir -p out
          shasum -a 256 "$S" | sed 's#research/ios18/##' > out/ios18-root-full.simg.sha256
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ROOT_KEY -in "$S" \
            | split -b 1900m - out/ios18-root-full.simg.enc.part-
          rm -f "$S"
          shasum -a 256 out/ios18-root-full.simg.enc.part-* > out/parts.sha256
          ls -l out; df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: ios18-root-encrypted
          path: out/
          compression-level: 0
          retention-days: 3
