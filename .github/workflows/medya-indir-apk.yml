name: medya-indir-apk

on:
  push:
    paths:
      - "apps/MedyaIndir/**"
      - ".github/workflows/medya-indir-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/MedyaIndir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK derle
        run: gradle --no-daemon assembleDebug
      - name: APK adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk MedyaIndir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedyaIndir-apk
          path: apps/MedyaIndir/MedyaIndir.apk
